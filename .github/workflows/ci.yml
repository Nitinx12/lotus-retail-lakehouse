name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PGPASSWORD: postgres

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  entrypoints:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run python main.py --list
      - run: uv run python main.py --help
      - run: make -n pipeline
      - run: make -n sql
      - run: make -n report
      - run: make -n notebooks
      - run: make -n dbt
      - run: make -n backup
      - run: make -n gate
      - run: make -n health
      - run: make -n security
      - run: make -n inspect
      - run: bash scripts/restore_postgres.sh 2>&1 | grep -q Usage
      - run: test -f run_pipeline.bat
      - run: cp .env.example .env
      - run: bash scripts/docker_up.sh config

  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/*.sh
      - run: git diff --check

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run pytest tests/unit -q

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run pytest tests/smoke -q

  dag-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run pytest tests/dag -q

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_OPS_HOST: localhost
      POSTGRES_OPS_DB: postgres
      POSTGRES_OPS_USER: postgres
      POSTGRES_OPS_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -f sql/ops_schema.sql
      - run: mkdir -p data/bronze
      - run: >
          uv run python -c "import pandas as pd;
          pd.DataFrame([{'customer_id': 'a', 'full_name': 'N', 'gender': 'Male', 'phone': '1'}]).to_parquet('data/bronze/dim_customers.parquet', index=False)"
      - run: uv run pytest tests/integration -q

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run sqlfluff lint sql/

  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_OPS_HOST: localhost
      POSTGRES_OPS_DB: postgres
      POSTGRES_OPS_USER: postgres
      POSTGRES_OPS_PASSWORD: postgres
      POSTGRES_GOLD_HOST: localhost
      POSTGRES_GOLD_DB: postgres
      POSTGRES_GOLD_USER: postgres
      POSTGRES_GOLD_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: sudo apt-get update -y && sudo apt-get install -y postgresql-client
      - run: uv run python main.py sql-ops sql-gold
      - run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -f tests/fixtures/seed_gold_clean.sql
      - run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U postgres <<'EOF'
          CREATE SCHEMA IF NOT EXISTS marts;
          CREATE TABLE marts.revenue_by_store_month AS
          SELECT store_id, to_char(order_date, 'YYYY-MM') AS month,
              sum(total_revenue) AS revenue, sum(total_cost) AS cost,
              count(*) AS orders
          FROM gold.fact_orders GROUP BY 1, 2;
          CREATE TABLE marts.return_rate_by_product AS
          SELECT product_id, count(*) AS times_ordered,
              0 AS times_returned, 0::numeric AS return_rate
          FROM gold.fact_order_details GROUP BY 1;
          CREATE TABLE marts.ramadan_seasonality AS
          SELECT to_char(o.order_date, 'YYYY-MM') AS month,
              (d.is_ramadan = 1) AS is_ramadan,
              sum(o.total_revenue) AS revenue, count(*) AS orders
          FROM gold.fact_orders AS o
          JOIN gold.dim_date AS d ON d.date_id = o.date_id
          GROUP BY 1, 2;
          EOF
      - run: uv run python main.py sql-gold
      - run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -c "SELECT * FROM gold.reconcile_marts();"
      - run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -t -A -c "SELECT count(*) FROM gold.reconcile_marts() WHERE failed <> 0;" | grep -qx 0
      - run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -c "INSERT INTO gold.fact_orders (order_id, order_date, date_id, customer_id, store_id, total_revenue, total_cost, customer_sk) VALUES ('bad', CURRENT_DATE + 1, 20220101, 'c', 1, 5.0, 2.0, NULL);" 2>&1 | grep -q "future order_date"
      - run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -c "INSERT INTO gold.fact_returns (return_id, order_id, return_amount) VALUES ('bad', 'o1', -5.0);" 2>&1 | grep -q "negative return_amount"
      - run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -c "INSERT INTO ops.pipeline_runs (run_id, task_name, status, error_message) VALUES (gen_random_uuid(), 'ci_probe', 'failed', 'ci');"
      - run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -t -A -c "SELECT count(*) FROM ops.alerts WHERE source_task = 'ci_probe';" | grep -qx 1
      - run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -c "INSERT INTO ops.quality_results (run_id, suite_name, success_percent, failed_expectations) VALUES (gen_random_uuid(), 'ci_suite', 50.0, 1);"
      - run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -t -A -c "SELECT count(*) FROM ops.alerts WHERE source_task = 'ci_suite';" | grep -qx 1
      - run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -c "CALL ops.close_stuck_runs();"
      - run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -c "CALL ops.purge_old_runs(0);"
      - run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -f sql/analysis/01_revenue_trend.sql
      - run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -f sql/analysis/02_return_outliers.sql
      - run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -f sql/analysis/03_ramadan_lift.sql

  plpgsql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -y && sudo apt-get install -y postgresql-client
      - run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -f sql/ops_schema.sql
      - run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -f tests/fixtures/seed_gold_clean.sql
      - run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -f sql/plpgsql_checks/source_checks.sql
      - run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -f sql/plpgsql_checks/gold_checks.sql
      - run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -f tests/fixtures/seed_gold_bad.sql
      - run: "! psql -v ON_ERROR_STOP=1 -h localhost -U postgres -f sql/plpgsql_checks/gold_checks.sql"

  dbt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_GOLD_HOST: localhost
      POSTGRES_GOLD_STAGING_DB: lotus_gold_staging
      POSTGRES_GOLD_USER: postgres
      POSTGRES_GOLD_PASSWORD: postgres
      DBT_PROFILES_DIR: ./dbt
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: sudo apt-get update -y && sudo apt-get install -y postgresql-client
      - run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -c "CREATE DATABASE lotus_gold_staging;"
      - run: psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d lotus_gold_staging -f tests/fixtures/seed_gold_clean.sql
      - run: uv run dbt run --project-dir dbt --target staging
      - run: uv run dbt test --project-dir dbt --target staging

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile.pipeline --target test -t lotus-pipeline:ci .
      - run: docker run --rm lotus-pipeline:ci
      - run: docker build -f docker/Dockerfile.dashboard -t lotus-dashboard:ci .
      - run: docker build -f docker/Dockerfile.report -t lotus-report:ci .
      - run: docker build -f docker/Dockerfile.airflow -t lotus-airflow:ci .
      - run: docker build -f docker/Dockerfile.api -t lotus-api:ci .

  dotnet-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test dotnet-api/LotusApi.sln
      - run: docker build -f docker/Dockerfile.api -t lotus-api:ci .
