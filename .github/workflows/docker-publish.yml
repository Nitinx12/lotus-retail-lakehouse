name: docker-publish

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lotus-pipeline
            dockerfile: docker/Dockerfile.pipeline
            target: runtime
          - name: lotus-dashboard
            dockerfile: docker/Dockerfile.dashboard
            target: runtime
          - name: lotus-report
            dockerfile: docker/Dockerfile.report
            target: runtime
          - name: lotus-airflow
            dockerfile: docker/Dockerfile.airflow
            target: runtime
          - name: lotus-api
            dockerfile: docker/Dockerfile.api
            target: runtime
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: hub
        run: |
          if [ -n "${DOCKERHUB_USER:-}" ]; then
            echo "enabled=true" >>"$GITHUB_OUTPUT"
          else
            echo "enabled=false" >>"$GITHUB_OUTPUT"
          fi
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      - uses: docker/login-action@v3
        if: steps.hub.outputs.enabled == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: images
        run: |
          {
            echo "list<<EOF"
            if [ "${{ steps.hub.outputs.enabled }}" = "true" ]; then
              echo "${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.name }}"
            fi
            echo "ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}"
            echo "EOF"
          } >>"$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.list }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
