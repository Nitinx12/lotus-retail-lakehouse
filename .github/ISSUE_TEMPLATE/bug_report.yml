name: Bug report
description: Report something broken in the pipeline, dashboard, or reports
title: "[bug]: "
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you see, and what did you expect instead
      placeholder: Gold publish failed with a duplicate key error
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - pipeline
        - analytics
        - infra
        - docs
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Commands run, in order, starting from a clean checkout
      placeholder: |
        1. uv sync
        2. uv run python main.py silver
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste the failing output. Remove secrets before pasting.
      render: shell
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS plus LOTUS_ENV value
      placeholder: Windows 11, LOTUS_ENV=dev
